<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005DA1">
<title>Orden de Trabajo · Ingenieros Asociados</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   ORDEN DE TRABAJO · IA BIOMÉDICA
   Dirección visual: panel de instrumento de calibración.
   Grafito profundo + ámbar de equipo de medición, etiquetas
   micro en versalitas, números tabulares. Sin fuentes web:
   la app debe abrir igual sin señal.
   ============================================================ */
:root{
  --ink:#06182A;
  --panel:#0D2740;
  --panel-2:#133351;
  --line:#1D4870;
  --amber:#ABE1F5;      /* celeste del logotipo: acento principal */
  --azul:#005DA1;       /* azul corporativo */
  --mint:#5FE0B4;
  --alert:#FF7A68;
  --text:#EAF4FB;
  --muted:#A6BED4;      /* Rev.43: más claro, se lee mejor al sol (7.9:1 sobre panel) */
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;     /* íconos de fecha/hora y barras de desplazamiento claros */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:calc(72px + var(--safe-b))}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- Lectura de estado (elemento firma) --- */
.readout{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--ink) 70%,rgba(6,24,42,.92));border-bottom:1px solid var(--line)}
.readout-top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--text)}
.brand span{color:var(--amber)}
.who{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.25}
.strip{display:flex;gap:0;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.cell{flex:1;padding:6px 10px 7px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cell:last-child{border-right:0}
.cell b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cell i{font-style:normal;color:var(--muted);text-transform:uppercase}
.on{color:var(--mint)} .off{color:var(--alert)} .wait{color:var(--amber)}

/* --- Estructura --- */
main{padding:14px 14px 24px;max-width:760px;margin:0 auto}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 4px;font-weight:700}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}

/* --- Campos --- */
label.f,div.f{display:block;margin-bottom:14px}
.f>span.lb{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.f>span.lb em{font-style:normal;color:var(--amber)}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);appearance:none}
textarea{min-height:96px;resize:vertical;line-height:1.45}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
input::placeholder,textarea::placeholder{color:#869FB8}

/* --- Chips (opción múltiple) --- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer;line-height:1.15;text-align:left}
.chip[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#06182A;font-weight:600}
.chip.neg[aria-pressed=true]{background:var(--alert);border-color:var(--alert);color:#06182A}

/* --- Botones --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:14px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#06182A}
.btn.ghost{background:transparent}
.btn.danger{color:var(--alert);border-color:#5A2E29}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:6px}
.actions>.btn{flex:1}

/* --- Firma --- */
.sigwrap{border:1px solid #9FC2DC;border-radius:8px;background:#F6FBFE;position:relative}
.sigwrap canvas{width:100%;height:170px;display:block;touch-action:none;border-radius:8px}
.sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#98A3AF;font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}

/* --- Fotos --- */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;background:rgba(18,22,28,.85);border:1px solid var(--line);border-radius:6px;color:var(--alert);width:26px;height:26px;line-height:1;cursor:pointer;font-size:14px}

/* --- Tabla de mediciones --- */
table.med{width:100%;border-collapse:collapse;font-size:13px}
table.med th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 4px 6px;font-weight:600}
table.med td{padding:0 4px 6px}
table.med input{padding:9px 8px;font-size:14px}

/* --- Listas --- */
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.5}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--mint);border-color:#1C5347}
.tag.pend{color:var(--amber);border-color:#1D4870}
.tag.err{color:var(--alert);border-color:#5A2E29}
.tag.asg{color:var(--amber);border-color:#1D4870;margin-right:4px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55}

/* --- Progreso por secciones --- */
.steps{display:flex;gap:4px;margin:2px 0 16px}
.steps b{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps b.done{background:var(--mint)}
.steps b.now{background:var(--amber)}

/* --- Barra inferior --- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(9,32,54,.97);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);backdrop-filter:blur(8px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px 11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-weight:600;position:relative}
nav.tabs button[aria-current=page]{color:var(--amber)}
nav.tabs .ic{font-size:17px;line-height:1}
nav.tabs .badge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--alert);color:#06182A;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}

/* --- Aviso --- */
.note{border-left:2px solid var(--amber);background:#0F2D45;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.5;margin-bottom:12px;color:#D7EEFA}
.note.bad{border-color:var(--alert);background:#2B1A18;color:#F8D8D2}
/* Aviso de versión nueva: encima de la barra inferior, sin tapar el contenido */
.actualizar{position:fixed;left:14px;right:14px;bottom:calc(84px + var(--safe-b));z-index:70;
  background:var(--amber);color:#06182A;border-radius:10px;padding:12px 14px;display:flex;
  align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.actualizar .txt{flex:1;font-size:13.5px;line-height:1.4;font-weight:600}
.actualizar button{background:#06182A;color:var(--amber);border:0;border-radius:7px;
  padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.actualizar .x{background:none;color:#06182A;padding:9px 4px;font-weight:600;opacity:.7}
.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + var(--safe-b));z-index:60;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:8px;padding:12px 14px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--alert)}
/* Tablero: columnas con desplazamiento horizontal, una a la vez en el celular */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.kcol{flex:0 0 84%;max-width:340px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.kcol h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.kcol h3 b{color:var(--text);font-weight:700}
.tarea{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.tarea.alta{border-left-color:var(--alert)}
.tarea.media{border-left-color:#FF9F43}
.tarea.baja{border-left-color:var(--mint)}
.tarea.con_observacion{border-left-color:var(--amber)}
.tarea .t{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px}
.tarea .d{font-size:11.5px;color:var(--muted);font-family:var(--mono);line-height:1.5}
.vistas{display:flex;gap:6px;margin-bottom:14px}
.vistas button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.vistas button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#06182A}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;overflow:hidden}
.cal .dn{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.cal .dia{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;font-size:11px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.cal .dia.vacio{background:none;border-color:transparent;cursor:default}
.cal .dia.hoy{border-color:var(--amber)}
.cal .dia .n{font-family:var(--mono);color:var(--muted);font-size:11px}
/* La barra se extiende hasta cruzar la separación entre celdas: así una tarea de
   varios días se lee como una línea continua y se ve la carga del ingeniero. */
.cal .dia .p{height:4px;background:var(--mint);margin:0 -5px;border-radius:0}
.cal .dia .p.ini{margin-left:0;border-top-left-radius:2px;border-bottom-left-radius:2px}
.cal .dia .p.fin{margin-right:0;border-top-right-radius:2px;border-bottom-right-radius:2px}
.cal .dia .mas{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1}
.cal .dia .p.alta{background:var(--alert)} .cal .dia .p.media{background:#FF9F43}
.mescab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mescab b{font-size:15px;text-transform:capitalize}
.hilo{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px;cursor:pointer}
.hilo .body{flex:1;min-width:0}
.hilo .t{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hilo .u{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hilo .h{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.burbujas{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.msj{max-width:86%;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.msj.mio{align-self:flex-end;background:var(--azul);border-color:var(--azul)}
.msj .a{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:600}
.msj.mio .a{color:#CDE8F8}
.msj .m{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msj .h{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:4px;text-align:right}
.msj.mio .h{color:#B6DCF2}
.redactar{position:sticky;bottom:calc(72px + var(--safe-b));background:var(--ink);padding-top:8px;display:flex;gap:8px;align-items:flex-end}
.redactar textarea{min-height:44px;max-height:120px}
.aviso{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.aviso.mantenimiento{border-left-color:var(--mint)}
.aviso.urgente{border-left-color:var(--alert)}
.aviso h3{margin:0 0 5px;font-size:15px;font-weight:600;line-height:1.3}
.aviso p{margin:0;font-size:13.5px;line-height:1.55;color:#C6DCEC;white-space:pre-wrap}
.aviso .meta{margin-top:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--muted);word-break:break-word}
.kv b{color:var(--text);font-weight:600}
/* El NIP: cuatro dígitos separados sin que el campo se desborde en pantallas chicas */
input.nip{width:100%;text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.45em;
  text-indent:.45em;padding:13px 12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* --- Utilidades (Rev.43: reemplazan los estilos que estaban escritos en el código) --- */
.mt3{margin-top:3px}.mt4{margin-top:4px}.mt5{margin-top:5px}.mt6{margin-top:6px}.mt8{margin-top:8px}
.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt20{margin-top:20px}
.mb0{margin-bottom:0}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}
.clic{cursor:pointer}.oculto{display:none}.pre{white-space:pre-wrap}.alto150{min-height:150px}
.txt-alerta{color:var(--alert)}.txt-tenue{color:var(--muted)}
.mono11{font-family:var(--mono);font-size:11px}.mono12{font-family:var(--mono);font-size:12px}.t13{font-size:13px}
.btn.compacto{padding:8px 12px}.btn.mini{padding:6px 10px;font-size:12px}.btn.cuadrado{padding:8px 10px}.btn.holgado{padding:12px 18px}
.subtitulo{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 8px;font-weight:700}
.subtitulo.sep{margin-top:16px}
.subtitulo.grupo{font-size:12px;letter-spacing:.1em;display:flex;justify-content:space-between}
.error-campo{display:block;margin-top:6px;font-size:12.5px;color:var(--alert)}
.col-fin{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fila-item{display:flex;gap:12px;align-items:flex-start}
.item.col{flex-direction:column;align-items:stretch}
.separado{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.nota-mini{font-size:12px;color:var(--muted);padding:6px 2px}
.mini-firma{border-radius:5px;background:#fff;flex-shrink:0}
.apagado{opacity:.55}
.diagnostico{margin-top:10px;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:11.5px;
  line-height:1.6;color:var(--muted);background:#04121F;border:1px solid var(--line);border-radius:8px;padding:10px}
.engrane{background:none;border:0;color:var(--muted);font-size:19px;cursor:pointer;padding:2px 0 2px 10px;line-height:1}
.engrane.activo{color:var(--amber)}
.acceso-marca{letter-spacing:.2em;font-size:12px;color:var(--muted);text-transform:uppercase}
.acceso-titulo{font-size:26px;margin:0;letter-spacing:-.01em}
.acceso-lead{max-width:320px}
.acceso-form{width:100%;max-width:380px}

/* --- Dos tipos de orden (Rev.45) --- */
.rejilla{display:flex;flex-wrap:wrap;column-gap:12px;align-items:flex-end}
.rejilla>.celda{flex:1 1 100%;min-width:0}
.rejilla>.celda.mitad{flex:1 1 calc(50% - 6px)}
.tipo-orden{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;margin-bottom:8px;border:1px solid var(--line);color:var(--amber)}
.tipo-orden.renta{color:var(--mint);border-color:#1C5347}
.tag.tipo{margin-right:6px;vertical-align:1px;color:var(--amber);border-color:var(--line)}
.tag.tipo.renta{color:var(--mint);border-color:#1C5347}
.eleccion{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:9px}
.eleccion-tit{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:2px 2px 4px}
.opcion-orden{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:13px 14px}
.opcion-orden b{font-size:16px;font-weight:700}
.opcion-orden span{font-size:13px;color:var(--muted);line-height:1.4}
.opcion-orden.renta{border-left-color:var(--mint)}
.opcion-orden:active{background:var(--line)}
.renglon-matriz{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:rgba(6,24,42,.35)}
.renglon-cab{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;min-height:30px}
.rejilla-matriz{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rejilla-matriz input.ancho{grid-column:1 / -1}
.ayuda-campo{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.4}
input.cp{flex:0 0 96px!important;min-width:0!important}
.logo-acceso{width:64px;height:64px;border-radius:14px;background:#fff;padding:6px;margin-bottom:4px}
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:14px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="root"><div class="center"><span class="spin"></span><span style="color:#8FAAC4;font-size:13px">Cargando…</span></div></div>

<script>
/* Si algo falla al arrancar, mostrarlo en pantalla. Sin esto la app queda en
   negro y no hay forma de saber qué pasó desde el celular. */
(function () {
  var mostrado = false;
  function avisar(msg) {
    if (mostrado) return; mostrado = true;
    var r = document.getElementById("root");
    if (!r) return;
    r.innerHTML = '<div style="padding:24px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#EAF4FB">' +
      '<div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#FF7A68;margin-bottom:8px">' +
      'La app no pudo abrir</div>' +
